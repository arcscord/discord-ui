name: Comparison preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  deployments: read

# Keep provider uploads ordered. A stale approval is checked again after waiting.
concurrency:
  group: comparison-preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
  SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
  GH_TOKEN: ${{ github.token }}

jobs:
  eligibility:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    name: Validate preview and prepare review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.identity.outputs.eligible }}
      pr: ${{ steps.identity.outputs.pr }}
      identity: ${{ steps.identity.outputs.identity }}
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up trusted Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Require configured deployment reviewers
        run: node scripts/preview/protection.mts
      - name: Verify CI, PR and artifact identities
        id: identity
        run: node scripts/preview/eligibility.mts
      - name: Validate archive, static policy and tested checkout before review
        if: steps.identity.outputs.eligible == 'true'
        run: node scripts/preview/publish.mts
        env:
          EXPECTED_IDENTITY: ${{ steps.identity.outputs.identity }}
      - name: Add tested checkout to review summary
        if: steps.identity.outputs.eligible == 'true'
        env:
          EXPECTED_IDENTITY: ${{ steps.identity.outputs.identity }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const path = `${process.env.RUNNER_TEMP}/preview-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}/metadata.json`;
          const data = JSON.parse(readFileSync(path, 'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nTested checkout \`${data.testedCheckoutSha}\`\n\n${data.testCount} comparison tests passed. Full diagnostics are attached to the CI run above.\n`);
          NODE

  upload:
    name: Approve and upload comparison preview
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: write
    environment:
      name: comparison-preview
      url: ${{ steps.upload.outputs.url }}
    env:
      EXPECTED_IDENTITY: ${{ needs.eligibility.outputs.identity }}
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up trusted Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Recheck deployment protection
        run: node scripts/preview/protection.mts
      - name: Revalidate approved revision before accessing provider credentials
        id: current
        run: node scripts/preview/eligibility.mts --expect
      - name: Download and verify approved artifacts again
        if: steps.current.outputs.eligible == 'true'
        run: node scripts/preview/publish.mts
      - name: Install pinned upload tool
        if: steps.current.outputs.eligible == 'true'
        run: npm install --prefix "$RUNNER_TEMP/preview-tools" --ignore-scripts --no-audit --no-fund wrangler@4.165.0
      - name: Upload and verify immutable preview
        id: upload
        if: steps.current.outputs.eligible == 'true'
        run: node scripts/preview/upload.mts
        env:
          WRANGLER_BIN: ${{ runner.temp }}/preview-tools/node_modules/.bin/wrangler
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          WRANGLER_SEND_METRICS: false
