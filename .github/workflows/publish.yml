name: Stage npm package

on:
  push:
    tags: ["v*", "core-v*", "vue-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to stage (for example v0.2.0 or core-v0.2.0).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      package-name: ${{ steps.release.outputs.packageName }}
      dist-tag: ${{ steps.release.outputs.distTag }}
      tarball: ${{ steps.release.outputs.tarball }}
    steps:
      - name: Checkout version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check version and membership in main
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release/verify.mts

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  stage:
    name: Stage verified tarball
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js for npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install staging-capable npm
        run: npm install --global npm@11.15.0
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: release
      - name: Verify published core dependency
        env:
          TARBALL: ${{ needs.validate.outputs.tarball }}
        run: node scripts/release/check-dependencies.mts "./release/$TARBALL"
      - name: Stage on npm
        env:
          TARBALL: ${{ needs.validate.outputs.tarball }}
          DIST_TAG: ${{ needs.validate.outputs.dist-tag }}
        run: |
          test -f "./release/$TARBALL"
          npm stage publish "./release/$TARBALL" --access public --provenance --ignore-scripts --tag "$DIST_TAG"
      - name: Write staging summary
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PACKAGE_NAME: ${{ needs.validate.outputs.package-name }}
          DIST_TAG: ${{ needs.validate.outputs.dist-tag }}
        run: |
          echo "Staged $PACKAGE_NAME@$VERSION with npm tag $DIST_TAG. Review and approve it manually in npm Staged Packages to publish." >> "$GITHUB_STEP_SUMMARY"
